type: object
additionalProperties: false
required: [title]

$defs:
  publicationLink:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: {type: string}
      pages: {type: array, items: {type: integer}, minItems: 1}
      heading: {type: string, description: "The list's heading as printed"}

  # An entry of a list that names a work (the photographed list of 1937 names works, not volumes).
  entryLink:
    type: object
    additionalProperties: false
    required: [id, item_no, name_as_printed]
    properties:
      id: {type: string}
      item_no: {type: integer, description: "Number in the list, as printed"}
      page: {type: integer, description: "Printed page of the entry in the list's publication"}
      subject: {type: string, description: "Subject heading, e.g. Logic"}
      name_as_printed: {type: string, description: "IAST; marks of the source kept"}
      author_as_printed: {type: string}
      size_slokas: {type: string}
      status: {type: string, description: "As printed: Complete, Incomplete, ..."}
      location:
        type: string
        description: "Key of the _locations document the list's sign names (checked by scripts/check_pages.py)"
      reproduction: {enum: [photographed, copied]}
      manuscript:
        type: string
        description: "Key of the _manuscripts document the entry is identified with (checked by scripts/check_pages.py)"
      match:
        description: >
          How sure the identification is. certain: the same work at the same place in exactly one
          catalogued volume; probable: a fitting title or description at the same place, or one of
          two copies chosen for a reason; possible: a weak candidate; list-only: no catalogued
          volume, so a volume record <location>-photographed-<no> was made from the list.
        enum: [certain, probable, possible, list-only]
      match_note: {type: string, description: "Why the entry is identified with that volume"}
      catalogue_no: {type: string, description: "Number or shelf mark in the list's own catalogue"}
      notes: {type: string}
      uncertain_fields: {type: array, items: {type: string}}

properties:
  title: {type: string}
  description: {type: string}
  legend:
    type: object
    description: "Abbreviations and signs the list uses, e.g. {x: copied, S: Sa-skya}"
    additionalProperties: {type: string}
  _publications:
    type: object
    additionalProperties: false
    properties:
      _published-in:
        type: array
        items: {$ref: "#/$defs/publicationLink"}
        minItems: 1
  _works:
    type: object
    additionalProperties: false
    properties:
      _includes:
        type: array
        items: {$ref: "#/$defs/entryLink"}
        minItems: 1
      _includes-also:
        description: "A further entry for a work already in _includes (see _contains-also of _manuscripts)"
        type: array
        items: {$ref: "#/$defs/entryLink"}
        minItems: 1
  notes: {type: string}
