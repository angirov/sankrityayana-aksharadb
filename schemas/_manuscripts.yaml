# A manuscript is one physical volume ("Vol. No." in the monastery catalogues).
# What the volume holds is a list of links to works; everything a list says about
# one title in this volume (number, script, size, colophon, ...) is an attribute
# of that link.
type: object
additionalProperties: false
required: [_works, _publications]

$defs:
  locationLink:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: {type: string}
      comment: {type: string}

  publicationLink:
    type: object
    additionalProperties: false
    required: [id, pages]
    properties:
      id: {type: string}
      pages:
        description: "Printed pages of the entry, footnotes included"
        type: array
        items: {type: integer}
        minItems: 1
      heading: {type: string, description: "Section heading as printed"}

  contentLink:
    type: object
    additionalProperties: false
    required: [id, name_as_printed, no_in_volume]
    properties:
      id: {type: string}
      source:
        type: string
        description: >
          The publication (key) whose list this entry comes from; given when the volume is
          described in more than one publication.
      item_no: {type: integer, description: "Running number of the title in the section"}
      no_in_volume: {type: integer, description: "Position of the title inside its volume; printed in the list unless no_in_volume_printed is false"}
      no_in_volume_printed: {type: boolean, description: "false when the position is not printed in the list but inferred"}
      sub_item_no: {type: integer, description: "Number inside a bundle of miscellaneous leaves"}
      subject: {type: string, description: "Subject heading, e.g. Logic (list of 1937)"}
      name_as_printed: {type: string, description: "IAST; editorial marks kept as printed"}
      name_gloss: {type: string}
      author_as_printed: {type: string}
      tibetan_translation: {type: boolean, description: "Marked T: preserved in Tibetan translation"}
      script: {type: string}
      size_inches: {type: string, description: "As printed, e.g. 11½×2½"}
      size_slokas: {type: string}
      leaves: {type: string}
      lines_per_page: {type: string}
      page_range: {type: string}
      status: {type: string, description: "As printed: Complete, Incomplete, ..."}
      colophon: {type: string, description: "IAST, from the footnote"}
      incipit: {type: string, description: "How the text begins, as quoted by the list (IAST)"}
      explicit: {type: string, description: "How the text ends, as quoted by the list (IAST)"}
      notes: {type: string}
      uncertain_fields:
        type: array
        items: {type: string}
        description: "Fields whose reading should be checked against the scan"

properties:
  vol_no: {type: string, description: "Volume number as printed (roman)"}
  _locations:
    type: object
    additionalProperties: false
    properties:
      _kept-in:
        type: array
        items: {$ref: "#/$defs/locationLink"}
        minItems: 1
        maxItems: 1
  _publications:
    type: object
    additionalProperties: false
    required: [_described-in]
    properties:
      _described-in:
        type: array
        items: {$ref: "#/$defs/publicationLink"}
        minItems: 1
  _works:
    type: object
    additionalProperties: false
    required: [_contains]
    properties:
      _contains:
        description: >
          A link is the volume, the work and its position in the volume: two copies of one
          work in one volume are two links at two positions.
        type: array
        linkDiscriminator: [no_in_volume]
        items: {$ref: "#/$defs/contentLink"}
        minItems: 1
  notes: {type: string}
