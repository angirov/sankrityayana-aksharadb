title: …parikathā
_authors:
  _composed-by:
    - id: asvaghosa
notes: "The title is printed incomplete in the list of 1935 (“…parikathā”, under Aśvaghoṣa). The report of 1938 (p. 139) calls it a separate work named Parikathā by a later author, probably of the 8th century, bound with the Tridaṇḍamālā of Aśvaghoṣa; the link to Aśvaghoṣa follows the list of 1935."
