title: Madhyāntavibhāga
other_titles: [Madhyāntavibhaṅgakārikā, Madhyāntavibhaṅgasūtra, Madhyāntavibhāgakārikā]
_authors:
  _composed-by:
    - id: maitreya
notes: "The list of 1935 has two titles, Madhyāntavibhaṅgakārikā and Madhyāntavibhaṅgasūtra (Spos-khang III, nos. 7, 8); they are not told apart (decided 2026-11-04). The list of 1938 has the Madhyāntavibhāgakārikā only, and in the place of the second title the Dharmadharmatāvibhāga."
