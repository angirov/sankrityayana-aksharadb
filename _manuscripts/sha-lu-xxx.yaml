      colophon: "iti śrīcakrasamvaravivṛtāvekapañcāśattamaḥ paṭalaḥ saptā(?mā)ptaḥ || kṛtiriyaṃ paṇḍitācāryabhavabhaṭapādānām || deyadharmmoyaṃ pravaramahāyānayāyinaḥ paramaśākyabhikṣudharmmakīrtteryadatra puṇyaṃ........|| mahārājādhirājaparameśvaraparamabhaṭāraka śrīmacchūrapāladevapādīya samvat 1 kārttikadina 4 || likhitamidaṃ pustakaṃ kārttabodhibaleneti || granthapramāṇamasya sahasra 3sa5 ||"
      incipit: "mārāṃ..rāgasandhau madanaharahare māyayoddhe(?) sarppammāsthāḥ sammohajāle grahiṇavalaripo gūhamāmatsarāgniṃ | nairātmye hetvabhāve praṇidhivigamane cittamātre ramadhvam (|) vaktrairevañcaturbhirjagadavatu diśana herukaśrīśarīraṃ ||"
      notes: "Footnote 3 gives the beginning and the end (verses not all transcribed). Status printed as a ditto mark."
