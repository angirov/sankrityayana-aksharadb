      incipit: "dāsarasāyanaṃ jñātvā rogavārddhakyanāśanaṃ | tasya sukha(vi)bodhārthaṃ ṭīkāṃ vacmi yathāśruti || prathamaṃ tāvadācāryanāgārjunapādāḥ karuṇāparavasa(?śa)tayā satvānāṃ siddhiṃ samīhamānāḥ sveṣṭadevatānamaskārapūrvvakaṃ dāsarasāyanaṃ kurvvanti sma || vahniri tyādi"
      explicit: "satvahitaṃ kathitaṃ paramārthaṃ kalpavaraṃ kathitaṃ śu(?su)karañca | tena bhavatvacireṇa janoyaṃ rogavimukto jineṣu ca bhaktaḥ || iti dāsarasāyanaṃ samāptam ||7||"
      notes: "Footnote 1 gives the opening and the last verse; the opening shows the MS. is a commentary (ṭīkā) on the Dāsarasāyana. Script printed as a ditto mark."
