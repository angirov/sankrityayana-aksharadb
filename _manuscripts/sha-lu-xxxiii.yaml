      notes: "Page 43. Footnote 1: leaf no. 6 is missing; well-written MS., but owing to bad ink in some places it is unreadable. It gives the end, the colophon and, in a later hand-writing, two verses on the Jatukarṇa family (“jatukarṇṇakule jātā yo manorathadāśataḥ …”)."
