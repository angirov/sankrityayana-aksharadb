      colophon: "ācārya śrī ma no ra tha na ndi kṛtāyāṃ vārttikavṛttau caturthaḥ paricchedaḥ samāptaḥ || likhiteyaṃ paṃḍi(ta) vi bhū ti ca ndre ṇa (1203 A. C.)......"
      incipit: "vimuktāvaraṇakleśaṃ dīptākhilaguṇaśriyaṃ | svaikavedyātmasampattiṃ namasyāmi mahāmunim || svayamapi kṛtināmahetuyanyairapi gamito bahuvistarairnnayoyam | tadapi ca sugamo na madvidhānāmiti vivṛticchalataḥ karomi cintām || [ahamapi na nijaikalābhalubdho na ca parakṛtyarasābhilāṣayuktaḥ | phalati punariyaṃ parārthavāñchāvratatirabhīṣṭaphalāni puṇyabhājām ||] na yadiha tanna nyāyyaṃ tenoditena ca kiṃ phalaṃ | yadiha bahuśastasyā vṛttau guṇaḥ kathaṃ kasya kaḥ | yadi paramasau vyākhyeyārthagrahasya virodhinī (|) vivṛtiracanāmātre tasmāt kṛtotra mayādaraḥ ||"
      notes: "Footnote 1: “The paper MS. begins”; it gives the opening verses and the colophon, written by Vibhūticandra. The bracketed verse is the source's."
