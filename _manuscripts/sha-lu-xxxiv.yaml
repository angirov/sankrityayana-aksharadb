      incipit: "pradhvastāśeṣadoṣāya samastaguṇaśāline | parānugrahadakṣāya buddhāyāstu namaḥ sadā || jayati khyātasatkīrttiścandraḥ sadguṇaratnabhūḥ | vyāptasamastavāṅmayo vācaspatirivāparaḥ || siddhamityādi |"
      notes: "Footnote 2: in the MS. 18 leaves (53-60, 80-89) are missing. Only the end of second Pāda of first Adhyāya is found “cāndre vyākaraṇe bhikṣuratnamatikṛtāyāṃṭīkāyāṃ”; in all other places the author is mentioned as simply Ratnamati. Perhaps Ratnamati did not write his commentary on the fourth Pāda of the sixth Adhyāya, so in the present MS. Pūrṇacandra's Pañjikā on that Pāda is added (no. 296)."
