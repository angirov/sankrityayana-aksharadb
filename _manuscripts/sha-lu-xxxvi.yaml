      notes: "Leaves printed “49×5”: 49 leaves and five rewritten ones. Footnote 3: some letters of leaves 46-49 were damaged, hence five more rewritten leaves were added at the end by a later hand; it gives the colophon of the new hand (Vibhūticandra). There are many notes on the MS. on the back of leaf 7a: “bhagavato nirvāṇakāla 1418, śaka 1143”, and a table of future eclipses (bhāvigrahaṇaṃ) for śaka 1133 (=1211 A. C.) to 1150 (=1228 A. C.), not transcribed. Author “..”."
