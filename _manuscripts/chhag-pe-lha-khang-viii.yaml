      incipit: "yā sarvajñatayā° | sarvākāramidaṃ° (as usual) | māyārūpasamānabhāvaviduṣāṃ muktiṃ parāṃ yogināṃ (|) saṃsārodaravarttidoṣanicaye sammūrcchitāṃ dehinaḥ | maitreyeṇa dayāvatā bhagavatā netuṃ svayaṃ sarvathā (|) prajñāpāramitānaye sphuṭatarā ṭīkākṛtā kārikā ||"
      notes: "Script column blank. Footnote 3 (pp. 24–25): “Out of 103 leaves 48 (2-21, 51-55, 57-79) are missing” (103 is the leaf count printed for no. 201, 53 for this one); it gives the beginning, then the Abhidharmakośakārikās (Ch. III) follow; “it seems the first portion is taken from Haribhadra’s commentary, and second portion is from some commentary on the Abhidharmakośa. Here MS. no. 201 is correct.” It quotes the last page (verses, not transcribed here) and the colophon."
