    - id: madhyantavibhaga
      source: sankrtyayana1938
      item_no: 8
      no_in_volume: 1
      name_as_printed: "Madhyāntavibhāgakārikā"
      author_as_printed: "Maitreyanātha"
      script: "Māgadhī"
      size_inches: "8¼×2¼"
      leaves: "8"
      lines_per_page: "7"
      status: "Complete"
      explicit: "madhyānta vibhāge ānuttaryaparicchedaḥ pañcamaḥ || || āryamaitreyakṛtamadhyāvibhāgamahāyānaśāstrakārikāḥ samāptāḥ ||"
      notes: "Page 162. In 1935 this title is no. 7. Footnote 1 (pp. 162–163): paper Ms. On the first extra title page: “ya-tse-bas-phul-bahi (=presented by ya-tse-ba) Mṅon-rtog-rgyan, Chos-chos-ñid-rnam-ḥbyed, Dbus-su-mthaḥ-rnam bṣhugs.” On the second extra title page: “maitreyakārikā”. In the end of Madhyāntavibhāga (p. 8b) as quoted. 1935 (no. 7, p. 28): “Madhyāntavibhaṅgakārikā”, Maitreya, marked T, script Nevārī; footnote 2: written on paper. 1935 also has, as no. 8, a “Madhyāntavibhaṅgasūtra” (Maitreya, T, Nevārī); the two are not told apart (one work, the Madhyāntavibhāga), and 1938 lists the Madhyāntavibhāga once."
    - id: dharmadharmatavibhaga
      source: sankrtyayana1938
      item_no: 363
      no_in_volume: 2
      name_as_printed: "Dharmadhamaṃtāpravibhāgasūtra"
      author_as_printed: "Maitreyanātha"
      script: "Māgadhī"
      size_inches: "8¼×2¼"
      leaves: "5"
      lines_per_page: "7"
      status: "Complete"
      incipit: "kiñcit parijñāya yataḥ praheyaṃ sākṣācca kiñcit karaṇīyamanyat | atastayorlakṣaṇatāvibhāgaṃ cikīrṣatā śāstramidaṃ praṇītaṃ || dvayamidaṃ sarvaṃ | dharmmatādharmmatāsaṃgrahāt | dharmmaprabhāvitaḥ saṃsāraḥ | dharmmatāprabhāvitaṃ yānatrayanirvāṇaṃ |"
      explicit: "dharmmāsatprakhyāne udāharaṇaṃ māyāsvapnādi (|) āśrayaparivṛttau vudāharaṇamākāśasuvarṇṇavāryādi || || dharmmadharmmatāsūtrāṇyāryamaitreyapādasya || dharmmadharmmatāpravibhāgasūtraṃ samāptam | …"
      notes: "Page 163. Title printed so (for Dharmadharmatā°). Author, script, size, lines and status printed as ditto marks. Footnote 1: it begins (p. 9a) and ends (p. 13a); the superscript figures inside the quotations are the source's. 1935 has no Dharmadharmatāvibhāga; in its place (no. 8, p. 28) it lists a “Madhyāntavibhaṅgasūtra” (Maitreya, T, Nevārī), taken as the Madhyāntavibhāga of position 1, so 1938 corrects 1935 here. The title page quoted with no. 8 of 1938 names the three Maitreya texts of the volume (Mṅon-rtog-rgyan, Chos-chos-ñid-rnam-ḥbyed, Dbus-su-mthaḥ-rnam)."
    - id: abhisamayalankara
      source: sankrtyayana1938
      item_no: 9
      no_in_volume: 3
      name_as_printed: "Abhisamayālaṃkāra"
      author_as_printed: "Maitreyanātha"
      script: "Māgadhī"
      size_inches: "8¼×2¼"
      leaves: "20"
      lines_per_page: "7"
      status: "Complete"
      colophon: "samāptamidamabhisamayālaṅkārākhyaṃ prajñāpāramitopadeśaśāstraṃ || || kṛtirbhagavata āryamaitreyasyeti ||…|| saṃvat 1370 (vik?=1313 A.C.) phālgunavadi 2 sani dine || surakṣetre || rājarājeśvaralokeśvaraśrīripumalladevarājye || tasmin kāle varttamāne || sakalaprakriyāmbi(?)rājambaguroḥ śrīpaṇḍitamuñjaśrīsyā(?)rthe || śrī vāstavyānvaye paṃ. śrī jīvadhareṇālekhi ||…"
      notes: "Page 163. In 1935 this title is no. 9. Author, script, size, lines and status printed as ditto marks. Footnote 2 gives the colophon. 1935 (no. 9, p. 28): “Abhisamayālaṃkāra”, Maitreya (ditto), marked T, script Nevārī (ditto); footnote 2: written on paper."
notes: "Described in 1935 and again, with corrections (“some correction and addition”), in 1938. The links follow 1938; the notes of each link give the reading of 1935 (decided 2026-11-04). 1935: written on paper (footnote 2), script Nevārī. 1938: paper Ms. (footnote 1), script Māgadhī, size 8¼×2¼."
