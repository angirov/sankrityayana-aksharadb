      notes: "Page 147. The section's footnote 1: some correction and addition to “Sanskrit Palm-leaf Mss. in Tibet” JBORS Vol. XXI, Part I, page 8 (i.e. the list of 1935, where no. 4 is “Aṣṭasāhasrikā … and others”). Author printed as a ditto mark under the heading. Footnote 2 (pp. 147–148): very old Ms. Names of some of the Sūtras and Dhāraṇīs are: “cūḍāmaṇi nāmama(hā)vidyā”, “saṃkṣiptā prajñāpāramitā”, “āryadhvajāgrakeyūrā nāma dhāraṇī”, “āryacandanāṅga nāma dhāraṇī”, “puṣpa-kūṭā(?)°” (p. 130b), “mārīcī mahāvidyā” (p. 131a), “mūlāparājitā mahāvidyā” (p. 133a), “āryāparājitā hṛdayaṃ” (p. 133b); here begins some new Sūtra or Dhāraṇī: “evammayā śrutamekāsmin samaye bhagavān pārāvate viṣaye sinca (?) nāma nagaraṃ gomino nāma vihāraḥ ...”; “vaiśālīpraveśaṃ (?) sūtraṃ mārīcyupadravopaśamanaṃ samāptaṃ ||”; here (p. 138a) some of the gāthās (quoted); “sarvāntarāyaviśodhanaṃ nāma mahāyānasūtraṃ”, “āryamahāpratisarā dvitīyamantrapadāni samāptāni” (p. 141a), “rāhulamahādaṇḍadhāraṇī” (p. 146b), “viśeṣavatī nāmadhāraṇī” (p. 135a), “aparājitāhṛdayaṃ” (p. 135b), “agrapradīpo nāma mahāyānasūtraṃ” (p. 151a), “āryamahādhāraṇī” (p. 152b), “ratnamālāparājitā samāptā”, “ārya tathāgatoṣṇīṣasitātapatrā nāmāparājitā pratyaṅgirā samāptā” (p. 156a), “sarvatathāgatādhiṣṭhānahṛdayaguhyadhātukaraṇḍaka mudrānāmadhāraṇī dharmaparyāyaḥ” (p. 161b), “āryavasudhārā dhāraṇī” (p. 163b), “... indraśailaguhāyāṃ” (p. 164b), “samantamukhapraveśaraśmivimaloṣṇīṣaprabhāsaṃ sarvatathāgatahṛdayasamayavilokitaṃ nāma dhāraṇīpadaṃ” (p. 171b), “āryavajrājitānalapramohanī nāma dhāraṇī” (p. 178a), “āryahiraṇyavatī nāma dhāraṇī” (p. 179b), “koṭidhāraṇī” (p. 179b), “āryaṣaḍmukhī nāma dhāraṇī”, “āryamā(?ma)ṇibhadradhāraṇī”, “caturdharmakannāma mahāyānasūtraṃ”. 1935 (no. 4, p. 28) also marks it T and Incomplete, the other columns “..”, with the note “and others” (further texts in the volume); 1938 corrects the title, and the link follows 1938 (decided 2026-11-04)."
