      incipit: "śrīmadyamadviṣamaśeṣaguṇaprasūtiṃ saṃvarttakāla......nīradanīlakāntim | cakṣustrayaṃ kuliśa khaḍgadharaṃ sakārtti cakrākṣakarpparabhṛtaṃ śirasā namāmi ||"
      explicit: "śreyaḥ śāradacandravad yadabhave ko nāntatantrāt sphuṭād(|) bhūtārthasphuṭapañjikā likhanataḥ śrīdharma dā sa sya me | lokastena samasta eva......bhīva bhūyājjine (:|) bhūyāsañca tadarthamāhitamano nirvāti yāvanna saḥ || parameśvaraparamasaugatamahārājādhi |"
      notes: "Page 45. Script, size and lines printed as ditto marks. Footnote 1 gives the beginning and the end."
