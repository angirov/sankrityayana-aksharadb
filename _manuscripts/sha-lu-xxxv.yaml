      incipit: "ādināthaṃ namaskṛtya hyadvayajñānavigrahaṃ | maṇḍalāṅgamahamvakṣye vajraśiṣyahitodayaṃ |"
      explicit: "ālokya tantrāṇi guruprasādād vahūni samyak pravicārya tajjñaiḥ (?) | prasannasaṃkṣiptapadaprabandhyaiḥ uktvā vidhiṃ viṃśatidhā vibhajya || yaḥ puṇyarāśiramito nicito mayādya tena prayātu janatā varavajradhṛktvaṃ | tenaivamātmayaśasā sahanāgavuddheḥ stheyāccīraṃ kṛtiriyaṃ varavajraratnamiti | samāpteyaṃ samājamaṇḍalopayikā mahāvajradharasya || kṛtiriyaṃ nāgabuddhipādānamiti ||......|| likhāpitā paṇḍitabhikṣujinaśrīmitreṇa | granthapramāṇaṃ 430 (|)"
      notes: "Page 45. Script, size and status printed as ditto marks. Footnote 2 gives the beginning and the end."
