      lines_per_page: "7"
      status: "Complete"
      incipit: "yo vidhvastasamastavastuvimalajñānodayānākulaḥ (|) prajñopāyamatā kṛpā samarasādeko dvayodyotate | māmakyādikaṭākṣaṣaṭpadagaṇairādṛṣṭa vaktrāmbujastaṃ natvā paramaṃ sukhaṃ jinamayaṃ vajrāmṛtaṃ likhyate ||"
      explicit: "iti likhitamananta tantragarbhaṃ paramasukhādvayabuddhisiddhi hetoḥ | guṇiṣu vimalabhadranāmna etad yadi rucīraṃ priyamastu naḥ kṣamaṃtāṃ || anuṣṭup chandasā caitat gaṇyamānaṃ catuḥśataṃ | ślokaiḥ katipayairyuktaṃ vajrāmṛtanivandhanaṃ || śrīvajrāmṛtapañjikā samāptā || kṛtiriyamācāryavi ma la bha drapādānāṃ | likhāpiteyaṃ pustikā paṇḍitajinaśrīmitreṇa ||"
      notes: "Page 45. Script, size and status printed as ditto marks. Footnote 3 gives the beginning and the end, and adds “T. °ṭīkā”."
