      incipit: "yo yogatantreṣu kṛto rahasyaiḥ svakāyavākcittamayairvicitraḥ | upāsya taṃ sarvvarahasyatantre rahaḥpradīpaḥ kriyate nibandhaḥ ||"
      explicit: "tatvānāmvivṛtau svayambhagavatastantre rahasyādvaye bhaktyā yat padaśaḥ sadarthakathayā puṇyammayā sañcitaṃ | śāntantena sanātanottamasukhaṃ labdhvā padamvajriṇo duḥkhāvarttavaśaṃ vaśī kramavaśādabhyuddhareyaṃ jagat || sarvarahasyanibandho ratnākaraśuddhavākyaratnamayaḥ | arthānatisūkṣmānapi rahaḥ pradīpaḥ prakāśayatu || śrīratnākaraśāntiviracitaḥ śrīśrīsarvarahasya nibandho rahaḥpradīpo nāmaparisamāptaḥ ||0||"
      notes: "Footnote 2 gives the beginning and the end, and adds “T. rahasya°”."
