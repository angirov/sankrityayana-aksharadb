      colophon: "deyadharmoyaṃ pravaramahāyānayāyinaḥ mahāsāmantādhipati mahārājādhirāja mahāmāṇḍalika śrī rudramāṇasuta paramopāsaka rājaputra śrī vikramāṇasya yadatra[3]puṇyantadbhavatvācāryopādhyāya mātā pitṛ pūrvaṅgamaṃ kṛtvā sakalasatvarāśeranuttara jñāna phalāvāptaya iti || || śrīmanmadanapāladevasya (1134-53 A.D.) rājya samvat 17 / namostu ratnatritayāya nityaṃ | lokatrayedhvāntavināśanāya | sarvāśramāṇāmapi maṇḍanāya divāpi rātrāvapi bhāsvarāya ||[4] / vaṅśocchedo na keṣāmabhavadiha mahīmaṇḍale pārthivānām (|) etasminmānavaṅśe svayamadhikalasatkarmmanirmāṇaramye | satyatyāgapratāpābhyudayanayadayācāraniḥsīmasaumye (|) maryādārakṣitakṣmāvalayamukhaśataṃ sārddhamāsannarendrāḥ | śrīballamāna nṛpate (r)nnaptā śrīrudramānanṛpateśca |[5] śrīdharmmamāṇanṛpatirbbabhūva tanayo nayanipuṇaḥ || ucchedamatrāpi kuṭumvabhedādāśaṅkya saubhrātraviśuddhasiddhiḥ | vyājena yasya kṣitirakṣaṇārthaṃ dharmāvatāraṃ punarapyakārṣīt || tasyānujo vikramamāṇanāmā śatrūnsamutsārya bhṛśaṃ bhujābhyām | āveṣṭayanbhūmimimāmakā[6]"
      notes: "Footnote 1 gives the colophon (manuscript page 68b), prose and then verse; the slashes mark the source's line breaks before the verses, and [3] to [6] are the source's own footnote marks, whose footnotes are not in the scan. The footnote breaks off at the end of p. 43 in the middle of a verse."
