      lines_per_page: "5,6"
      status: "Complete (?)"
      incipit: "anyāyamārgānugataṃ samīkṣya prāyeṇa lokaṃ karuṇāyamānaḥ (|) kudṛṣṭijālāśanitulyametat cakāra śāstraṃ bhagavadvivekaḥ || apratarkyamavijñeyamanālayamalakṣaṇaṃ (|) anirūpyaṃ svasaṃvedyamanādinidhanaṃ śivaṃ (|) nirvikalpaṃ nirābhāsaṃ nir(ma.........|...) yaṃ nādvayaṃ śāntaṃ dhīpracāravivarjitaṃ || tatvaṃ dideśa kāruṇyād yo nirakṣaramakṣaraiḥ (|) bhāvatostu namastasmai śāstre vitathavādine |"
      explicit: "advaye vyomavattattve, ninīṣustatvabhavyatāṃ (|) lokadvayopakārāya yastavyo loka saṃvṛtiṃ (|) lo(ka-) krāntaye prāha tasmai lokavide namaḥ || iti madhyamakasyedaṃ saṃkṣepāddhṛdayaṃ kṛtaṃ | dhīmatāṃ naikasūtrāntavimbadarśanadarpaṇaṃ || tarkajvālānāma sūtraṃ samāptamiti || || deya dharmoyaṃ auttarāpathikaśrāmaṇeravandhadha rmā ka ra se na sya ......"
      notes: "Footnote 1: worn out MS., the page numbers are gone; it gives the beginning, some names of the chapters (I. bodhicittāparityāga, II. munivratasamāśraya, III. tattvajñānāvatāra, IV. śrāvakatattvaviniścaya, V. yogācāratattvaviniścaya, VI. (sāṃkhyatattvaviniścaya), VII. vaiśeṣikatattvaviniścaya, VIII. vedāntatattvaviniścaya, IX. ...), the end, and on the back of the last leaf the opening of another work (“janasya yo muktipathānuyāyinīnirākṛtāntadvayayuktiṣaṣṭhikāṃ …”, a commentary on the Yuktiṣaṣṭikā?). “Rañjana °” printed so."
