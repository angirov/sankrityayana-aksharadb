      notes: "The author stands in the name column. Footnote 4: a chapter of the Yogācārabhūmi. Footnote 3: leaves 1 and 128 missing; there are two Bhūmis, Śrāvakabhūmi and Pratyekabuddhabhūmi. It quotes p. 15b “śrāvaka-bhūmāvāvatārabhūmiḥ samāptā ||0|| naiṣkramyabhūmiḥ katamā |”, p. 66a “yogācārabhūmau śrāvakabhūmisaṃgṛhītāyāṃ prathamayogasthānam ||” “laukikaṃ caiva vairāgyaṃ tathā lokottareṇa ca | tayoścaiva hi saṃbhāro bhūmirnaiṣkramya saṃjñitam |”, p. 129a “śrāvakabhūmau caturthayogasthānaṃ | samāptā śrāvakabhūmiḥ ||”."
