      lines_per_page: "5"
      status: "complete"
      notes: "Page 160. Author, script, size and lines printed as ditto marks. The list of 1935 has this title as no. 6 (“…parikathā”). Footnote 1 quotes the beginning (“… vakṣye parikathāścitrāḥ śaraṇādisamāśrayāḥ …”), names other Parikathās with their pages, among them “dānaparikathā” (p. 9a), “tadbhaktajanānugrahāya parikathā” (p. 36b), “tathāgatapratimācitrayituḥ saṃharṣaṇārthaṃ parikathā” (p. 42ab), “stūpasatkārādhikāre” (p. 45b), “śokavinodanārthaṃ … parikathā” (p. 49a), “tīrthābhiṣekaparīkṣā” (p. 54a), “agnipraveśādi dharmmaparīkṣā” (p. 55b), and the end (p. 57a); pp. 160–162, the long passages not transcribed here. 1935 (no. 6, p. 28): “…parikathā”, author printed as a ditto mark (Aśvaghoṣa), the other columns “..”; no vol. no. printed there either."
      uncertain_fields: [author_as_printed]
notes: "Described in 1935 and again, with corrections (“some correction and addition”), in 1938. The links follow 1938; the notes of each link give the reading of 1935 (decided 2026-11-04). The vol. no. is printed in neither list: in 1938 (p. 157) the Vol. column of nos. 6–7 is empty, only the number in the volume (1, 2) begins anew, so this is most likely vol. II, its number left out by mistake."
