      notes: "Page 157. The Vol. column is empty (only the number in the volume, 1, is printed); a new count begins, so this is most likely vol. II, its number left out by mistake; the list of 1935 has its no. 6 (…parikathā of Aśvaghoṣa) there. Footnote 1: on the front page “Tridaṇḍamālā” in Sanskrit, and “Rgyud-gsum-phreṅ-ba” and “Rgyud-phyag-3-pahi-phreṅ-ba”; it begins “namoratnatrayāya || yasyedaṃ sakalāmalendukiraṇaprakhyairyaśobhirjagad vyāptaṃ …” and quotes more (pp. 157–160), not transcribed here. 1935 (no. 5, p. 28): “A Commentary on some Sarvāstivāda Sūtras”, Aśvaghoṣa; footnote 1 gives the colophon “sarvāstivādī śākyabhikṣu aśvaghoṣaḥ....|”; the other columns “..”. Most likely this manuscript, the Tridaṇḍamālā, was recorded in 1935 under that description (decided 2026-11-04)."
