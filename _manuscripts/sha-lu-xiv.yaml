    - id: abhidharmadipa
      item_no: 248
      no_in_volume: 6
      name_as_printed: "Abhidharmapradīpa with Vibhāṣā-prabhāvṛtti"
      script: "Śāradā"
      size_inches: "22×2⅛"
      leaves: "63"
      lines_per_page: "9"
      status: "Incomplete"
      incipit: "svasti || namassarvajñāya || yo duḥkhahetuvyupaśāntimārgaṃ pradarśayāmāsa narāmarebhyaḥ | ......taṃ satpathajñaṃ praṇipatya buddhaṃ śāstraṃ kariṣyābhyabhidharmadīpaṃ ||"
      explicit: "abhidharmapradīpavibhāṣāprabhāyāṃ vṛttau aṣṭamasyādhyāyasya tṛtīyaḥ pādassamāptaḥ |"
      notes: "Page 35 (“Abhidharmapradīpa” printed so). The MS. holds the Abhidharmadīpa with its commentary Vibhāṣāprabhāvṛtti; both are linked. Footnote 3 (pp. 35–36): it is with commentary, which begins with “atra ṣaṣṭhīsamāsaparigrahe sati mārgasatyaṃ pradhānaṃ |”; from leaves 1 to 150, following 84 are missing: 2-30, 40, 46, 48, 50-52, 54-81, 83-90, 119-25, 127-129, 131-33, 138, 140, 145, 147, 149; every chapter has four Pādas; the third Pāda of the eighth (perhaps the last) ends at page 150b; the whole book contained not more than 160 leaves. It lists the subjects with pages and chapters (skandha, p. 1b, Ch. I.1 … samādhiguṇa, p. 150b, Ch. VIII.4). Status printed as a ditto mark."
