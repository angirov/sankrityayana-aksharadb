      incipit: "jīyāsuḥ sarahaprabhākaraparisphūrjadvaco raśmayaḥ | prajñābhṛṅgavadhūryadabhyudayato labdhaprabodhodayāḥ | pakṣapātavidhūtajāḍyavikasaccetojja(?)gatsatāṃ (|) samyaktatvamadhuprabhā na rasanā nirddha(ndva)munmādyati || ..."
      explicit: "kṛtvā vṛttiṃ prabandhasya yadalambhi śubhaṃ mayā | tenāstu sakalo lokaḥ prabandhārthaparāyaṇaḥ || siddhācāryaśrīsarahapādaprabandhavṛttiḥ samāptā || || kṛtiriyaṃ paṇḍitasthavira bandhu kī rtti pādānāṃ |"
      notes: "Script printed as a ditto mark. Footnote 3 gives the opening verse and the end: it is a short glossary on Saraha's 77 verses in ancient Hindi. The text at the top of p. 37 (a commentary with Apabhraṃśa verses) continues the footnote of no. 251 and is not transcribed."
