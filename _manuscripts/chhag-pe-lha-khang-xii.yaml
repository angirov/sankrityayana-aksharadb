      incipit: "śrīmadgurościcaraṇa nīrajareṇuvṛndaṃ bhaktyā sadā a(?)mala guṇaṃ śirasā praṇamya || kalyāṇa salya (sic) varasātana (sic) siddhyupāyaṃ vakṣye vipakṣatimirāpahayukti pra(?)dīpaṃ |"
      notes: "No vol. no. printed; taken as the second title of vol. XII. Footnote 5: it is a small treatise on Vajrayāna; it gives the opening verse and then “ye tāvad vadanti bālāḥ sakalavikalpajālajaḍīkṛtā vi (sic) samyaggurūpadeśaprāptimātreṇa buddhatvaṃ siddhaṃ bhavati |”. Author “..”. Continued on p. 28 by an unnumbered paragraph: the names of Nāgārjuna (pp. 1b, 2a), śrī Indrabhūtipāda (p. 2b) and Bhadrapāda (p. 3a) are cited as authority; there are also quotations from the Bodhicaryāvatāra (p. 1b) and the Māyājālamahātantra (p. 2a). Footnote 1 of p. 28, printed against no. 208, seems to belong here too: on page 2b one song of Saraha (“viṇu jhāṇeṃ viṇu pāthājjeṃ gehavasante samaghara bhajje | jai baḍha viṣaya ramante na muccai | bhaṇai saraha pari āṇa ko vuccai ||”); the last verse “kṛtvā vimārgapatitān prati yuktidīpaṃ mithyābhimānatamasāvihitāndhakārān | prāptaṃ mayā yadamalaṃ sukṛtaṃ samāsāt satvāstatośanibhṛto nikhilā bhavantu ||7||” names the yuktidīpa."
      uncertain_fields: [notes]
