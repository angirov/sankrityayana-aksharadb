title: MSS. Photographed or copied
description: >
  Manuscripts Sāṅkṛtyāyana photographed or copied during his second journey,
  printed after the monastery catalogue of 1937, grouped by subject.
legend:
  x: copied (the others are photographed)
  S: Sa-skya
  Ng: Ngor
  Sh: Sha-lu
_publications:
  _published-in:
    - {id: sankrtyayana1937, pages: [54, 55, 56, 57], heading: "MSS. Photographed or copied"}
notes: "55 entries, grouped by subject (Poetry 1–3, Prosody 4, Philosophy 5–19, Logic 20–44, Vinaya 45–55). The list ends with no. 55 on p. 57, whose lower half is blank: it is complete. Each entry is a manuscript record photographed-1937-NN; most are probably volumes of the catalogues, noted but not merged."
